# Default values for justscan.
# Override any value with --set or a custom values file.

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []
# - name: ghcr-creds

# ------------------------------------------------------------------
# Backend
# ------------------------------------------------------------------
backend:
  image:
    repository: ghcr.io/justlabv1/justscan
    # When empty, the chart defaults to backend-<Chart.appVersion>.
    # For Artifactory Xray-only deployments, set this to backend-minimal-<version>
    # and set backend.config.scanner.enableTrivy=false and enableGrype=false.
    tag: ""
    pullPolicy: IfNotPresent

  replicaCount: 1

  # Resource requests & limits
  resources: {}
  #   requests:
  #     cpu: 100m
  #     memory: 256Mi
  #   limits:
  #     cpu: 500m
  #     memory: 512Mi

  # Non-secret configuration. These values are rendered into a ConfigMap and
  # mounted as /etc/justscan/config.yaml. Secrets are injected as env vars
  # (which Viper reads via AutomaticEnv, overriding file values).
  config:
    logLevel: info
    port: 8080

    # CORS origins. Must include every URL users access the frontend from.
    allowOrigins:
      - "http://localhost:3000"

    database:
      # When postgresql.enabled=true this is auto-derived from the subchart service name.
      # Set explicitly when using an external database (postgresql.enabled=false).
      server: ""
      port: 5432
      # When postgresql.enabled=true this is auto-derived from postgresql.auth.database.
      # Set explicitly when using an external database (postgresql.enabled=false).
      name: justscan
      # When postgresql.enabled=true this is auto-derived from postgresql.auth.username.
      # Set explicitly when using an external database (postgresql.enabled=false).
      user: postgres
      driver: postgres

    scanner:
      # Set enableTrivy and enableGrype to false when using a backend-minimal image.
      enableTrivy: true
      trivyPath: trivy
      grypePath: grype
      enableGrype: false
      timeout: 600
      commandTimeoutSeconds: 7200
      progressHeartbeatSeconds: 30
      staleTimeoutSeconds: 7200
      concurrency: 2
      dbMaxAgeHours: 7
      enableOsvJavaAugmentation: true

    vulnKb:
      cacheDays: 7

    # Set to false to disable local username/password authentication.
    # When false, only external identity providers are available.
    localAuth:
      enabled: true

  # ------------------------------------------------------------------
  # Secrets
  # ------------------------------------------------------------------
  # Sensitive values are stored in a Kubernetes Secret and injected as
  # environment variables (BACKEND_JWT_SECRET, BACKEND_DATABASE_PASSWORD,
  # BACKEND_ENCRYPTION_KEY, BACKEND_VULN_KB_NVD_API_KEY).
  #
  # Option A (default): provide values here — the chart creates the Secret.
  # Option B: use pre-existing Secret references. Set existingSecret as a
  #           default Secret name, then configure existingSecretRefs keys.
  #           Set a per-field name only when that value lives in another Secret.
  secrets:
    jwtSecret: ""
    dbPassword: ""
    # Random 32-character string used to encrypt registry credentials.
    encryptionKey: ""
    # Optional — speeds up CVE enrichment
    nvdApiKey: ""

    # Default pre-existing Secret name. When set, the chart skips Secret
    # creation and fields in existingSecretRefs with an empty name use this
    # Secret.
    existingSecret: ""
    # Per-field Secret references. Leave name empty to use existingSecret or,
    # when existingSecret is empty, the chart-created Secret for that field.
    existingSecretRefs:
      jwtSecret:
        name: ""
        key: "jwt-secret"
      dbPassword:
        name: ""
        key: "db-password"
      encryptionKey:
        name: ""
        key: "encryption-key"
      nvdApiKey:
        name: ""
        key: "nvd-api-key"

  service:
    type: ClusterIP
    port: 8080

  customCAs:
    # Reference an existing ConfigMap and/or Secret containing PEM-encoded CA files.
    # All keys are mounted as files and appended to a runtime CA bundle used via SSL_CERT_FILE.
    configMapName: ""
    configMapOptional: false
    secretName: ""
    secretOptional: false
    bundlePath: /app/data/ca-certificates/custom-ca-bundle.crt

  persistence:
    enabled: false
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    storageClass: ""

  # Additional environment variables (plain, non-secret)
  extraEnv: []
  # - name: BACKEND_SOME_VAR
  #   value: "value"

# ------------------------------------------------------------------
# Frontend
# ------------------------------------------------------------------
frontend:
  image:
    repository: ghcr.io/justlabv1/justscan
    # When empty, the chart defaults to frontend-<Chart.appVersion>.
    tag: ""
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources: {}

  config:
    # URL the frontend's Next.js server uses to reach the backend API.
    # Defaults to the backend Service ClusterIP URL if left empty.
    apiUrl: ""

  service:
    type: ClusterIP
    port: 3000

  extraEnv: []

# ------------------------------------------------------------------
# Ingress
# ------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  #   kubernetes.io/ingress.class: nginx
  #   cert-manager.io/cluster-issuer: letsencrypt-prod

  hosts:
    - host: justscan.example.com
      paths:
        - path: /
          pathType: Prefix

  tls: []
  #  - secretName: justscan-tls
  #    hosts:
  #      - justscan.example.com

# ------------------------------------------------------------------
# PostgreSQL (Bitnami subchart)
# ------------------------------------------------------------------
postgresql:
  # Set to false to use an external database.
  # When false, configure backend.config.database.server with the external host.
  enabled: true

  auth:
    database: justscan
    username: justscan
    # When postgresql.enabled=true the backend reads this password from the
    # Bitnami subchart secret. When using an external DB, set
    # backend.secrets.dbPassword directly instead.
    password: ""
    # existingSecret: ""  # Use a pre-existing secret for the postgres password

  primary:
    persistence:
      enabled: true
      size: 8Gi
      # storageClass: ""

# ------------------------------------------------------------------
# Service Account
# ------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}

# ------------------------------------------------------------------
# Pod config
# ------------------------------------------------------------------
podAnnotations: {}
podSecurityContext: {}
securityContext: {}

nodeSelector: {}
tolerations: []
affinity: {}
