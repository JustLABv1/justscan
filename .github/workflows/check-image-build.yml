name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
      backend: ${{ steps.filter.outputs.backend }}
      cli: ${{ steps.filter.outputs.cli }}
      combined: ${{ steps.filter.outputs.combined }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'services/frontend/**'
              - '.github/workflows/check-image-build.yml'
            docs:
              - 'services/docs/**'
              - '.github/workflows/check-image-build.yml'
            backend:
              - 'services/backend/**'
              - '.github/workflows/check-image-build.yml'
            cli:
              - 'services/cli/**'
              - '.github/workflows/check-image-build.yml'
            combined:
              - 'Dockerfile'
              - 'docker-entrypoint.sh'
              - 'services/backend/**'
              - 'services/frontend/**'
              - 'services/docs/**'
              - '.github/workflows/check-image-build.yml'

  frontend-compile:
    name: Frontend — Compile Check
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: pnpm
          cache-dependency-path: services/frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: services/frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: services/frontend
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  docs-compile:
    name: Documentation — Compile Check
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: pnpm
          cache-dependency-path: services/docs/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: services/docs
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: services/docs
        run: |
          pnpm lint
          pnpm check:links
          pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  backend-compile:
    name: Backend — Compile Check
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/backend/go.mod
          cache-dependency-path: services/backend/go.sum

      - name: Build
        working-directory: services/backend
        run: go build ./...

  cli-test:
    name: CLI — Test & Build
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/cli/go.mod
          cache-dependency-path: services/cli/go.sum

      - name: Test
        working-directory: services/cli
        run: |
          go vet ./...
          go test ./...
          go build ./cmd/justscan

  frontend-image-build:
    name: Frontend — Docker Build Check
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: services/frontend
          file: services/frontend/Dockerfile
          push: false

  docs-image-build:
    name: Documentation — Docker Build Check
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: services/docs
          file: services/docs/Dockerfile
          push: false

  backend-image-build:
    name: Backend — Docker Build Check
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [runner, runner-minimal]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v7
        with:
          context: services/backend
          file: services/backend/Dockerfile
          target: ${{ matrix.target }}
          push: false

  cli-image-build:
    name: CLI — Docker Build Check
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/cli/Dockerfile
          push: false

  combined-image-build:
    name: Combined — Docker Build Check
    needs: changes
    if: needs.changes.outputs.combined == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
