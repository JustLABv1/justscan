apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "justscan.fullname" . }}-backend
  labels:
    {{- include "justscan.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  config.yaml: |
    log_level: {{ .Values.backend.config.logLevel | quote }}
    port: {{ .Values.backend.config.port }}

    database:
      driver: {{ .Values.backend.config.database.driver | quote }}
      server: {{ include "justscan.postgresql.host" . | quote }}
      port: {{ .Values.backend.config.database.port }}
      name: {{ include "justscan.postgresql.database" . | quote }}
      user: {{ include "justscan.postgresql.user" . | quote }}
      # password is injected via BACKEND_DATABASE_PASSWORD env var

    jwt:
      # secret is injected via BACKEND_JWT_SECRET env var
      secret: ""

    allow_origins:
      {{- range .Values.backend.config.allowOrigins }}
      - {{ . | quote }}
      {{- end }}

    scanner:
      enable_trivy: {{ .Values.backend.config.scanner.enableTrivy }}
      trivy_path: {{ .Values.backend.config.scanner.trivyPath | quote }}
      grype_path: {{ .Values.backend.config.scanner.grypePath | quote }}
      enable_grype: {{ .Values.backend.config.scanner.enableGrype }}
      timeout: {{ .Values.backend.config.scanner.timeout }}
      command_timeout_seconds: {{ .Values.backend.config.scanner.commandTimeoutSeconds }}
      progress_heartbeat_seconds: {{ .Values.backend.config.scanner.progressHeartbeatSeconds }}
      stale_timeout_seconds: {{ .Values.backend.config.scanner.staleTimeoutSeconds }}
      concurrency: {{ .Values.backend.config.scanner.concurrency }}
      db_max_age_hours: {{ .Values.backend.config.scanner.dbMaxAgeHours }}
      scan_cache_cleanup_hours: {{ .Values.backend.config.scanner.scanCacheCleanupHours }}
      enable_osv_java_augmentation: {{ .Values.backend.config.scanner.enableOsvJavaAugmentation }}

    encryption:
      # key is injected via BACKEND_ENCRYPTION_KEY env var
      key: ""

    vuln_kb:
      # nvd_api_key is injected via BACKEND_VULN_KB_NVD_API_KEY env var
      nvd_api_key: ""
      cache_days: {{ .Values.backend.config.vulnKb.cacheDays }}
      cve_history_enabled: {{ .Values.backend.config.vulnKb.cveHistoryEnabled }}
      cve_history_interval_minutes: {{ .Values.backend.config.vulnKb.cveHistoryIntervalMinutes }}
      cve_history_initial_lookback_hours: {{ .Values.backend.config.vulnKb.cveHistoryInitialLookbackHours }}

    local_auth:
      enabled: {{ .Values.backend.config.localAuth.enabled }}

    mcp:
      enabled: {{ .Values.backend.config.mcp.enabled }}
      http_enabled: {{ .Values.backend.config.mcp.httpEnabled }}
      endpoint: {{ .Values.backend.config.mcp.endpoint | quote }}
      max_page_size: {{ .Values.backend.config.mcp.maxPageSize }}
      max_request_body_bytes: {{ .Values.backend.config.mcp.maxRequestBodyBytes }}
