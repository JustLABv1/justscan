name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  image-policy-gate:
    name: Images — JustScan policy gate
    # Secrets are never available to pull requests from forks. Do not use
    # pull_request_target here: that would execute untrusted PR code with secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      JUSTSCAN_URL: ${{ secrets.JUSTSCAN_URL }}
      JUSTSCAN_ORG_ID: ${{ secrets.JUSTSCAN_ORG_ID }}
      JUSTSCAN_TOKEN: ${{ secrets.JUSTSCAN_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: services/backend
          file: services/backend/Dockerfile
          load: true
          tags: justscan-pr/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend

      - uses: ./.github/actions/justscan-local-image-gate
        with:
          image-tags: justscan-pr/backend:${{ github.sha }}

      - name: Build minimal backend image
        uses: docker/build-push-action@v7
        with:
          context: services/backend
          file: services/backend/Dockerfile
          target: runner-minimal
          load: true
          tags: justscan-pr/backend-minimal:${{ github.sha }}
          cache-from: type=gha,scope=backend-minimal

      - uses: ./.github/actions/justscan-local-image-gate
        with:
          image-tags: justscan-pr/backend-minimal:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: services/frontend
          file: services/frontend/Dockerfile
          load: true
          tags: justscan-pr/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend

      - uses: ./.github/actions/justscan-local-image-gate
        with:
          image-tags: justscan-pr/frontend:${{ github.sha }}

      - name: Build combined image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: justscan-pr/combined:${{ github.sha }}
          cache-from: type=gha,scope=combined

      - uses: ./.github/actions/justscan-local-image-gate
        with:
          image-tags: justscan-pr/combined:${{ github.sha }}

      - name: Build CLI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/cli/Dockerfile
          load: true
          tags: justscan-pr/cli:${{ github.sha }}
          cache-from: type=gha,scope=cli-image

      - uses: ./.github/actions/justscan-local-image-gate
        with:
          image-tags: justscan-pr/cli:${{ github.sha }}

  frontend-compile:
    name: Frontend — Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.14.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: pnpm
          cache-dependency-path: services/frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: services/frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: services/frontend
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  backend-compile:
    name: Backend — Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/backend/go.mod
          cache-dependency-path: services/backend/go.sum

      - name: Build
        working-directory: services/backend
        run: go build ./...

  cli-test:
    name: CLI — Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/cli/go.mod
          cache-dependency-path: services/cli/go.sum

      - name: Test
        working-directory: services/cli
        run: |
          go vet ./...
          go test ./...
          go build ./cmd/justscan
