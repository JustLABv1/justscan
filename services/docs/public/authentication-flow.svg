<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" role="img" aria-labelledby="title desc">
  <title id="title">JustScan authentication flow</title><desc id="desc">A user signs in through JustScan or an OIDC provider, then receives a JustScan session that is authorized for the selected workspace.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#17211c}.box{fill:#f5faf6;stroke:#3f8d57;stroke-width:2}.arrow{stroke:#3f8d57;stroke-width:3;fill:none}.label{font-size:17px;font-weight:700}.body{font-size:13px;fill:#45604d}</style>
  <rect width="920" height="250" rx="18" fill="#fbfdfb"/><rect class="box" x="35" y="72" width="190" height="105" rx="14"/><text class="label" x="84" y="112">User browser</text><text class="body" x="69" y="139">opens JustScan</text>
  <path class="arrow" d="M225 124H305m-12-8 12 8-12 8"/><rect class="box" x="305" y="72" width="190" height="105" rx="14"/><text class="label" x="346" y="112">JustScan</text><text class="body" x="326" y="139">local auth or OIDC</text>
  <path class="arrow" d="M495 124H575m-12-8 12 8-12 8"/><rect class="box" x="575" y="72" width="190" height="105" rx="14"/><text class="label" x="616" y="112">OIDC provider</text><text class="body" x="605" y="139">claims and groups</text>
  <path class="arrow" d="M670 177v35H400v-35m-12 8 12-8 12 8"/><rect class="box" x="305" y="190" width="190" height="42" rx="14"/><text class="label" x="333" y="217">JustScan session</text>
  <text class="body" x="522" y="219">role and organization access</text>
</svg>
