upstream backend  { server backend:8080;  }
upstream frontend { server frontend:3000; }

server {
    listen 80;
    server_name _;

    # Large archive uploads can take substantial time before the backend can
    # return its asynchronous scan-accepted response.
    proxy_connect_timeout  10s;
    proxy_read_timeout    2h;
    proxy_send_timeout    2h;
    client_body_timeout   2h;
    # Allow multipart framing above the backend's 5 GiB archive limit.
    client_max_body_size  6g;

    # Backend API
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering         off;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Frontend — everything else
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket support (Next.js streaming / HMR)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
