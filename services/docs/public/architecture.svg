<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">JustScan deployment topology</title>
  <desc id="desc">A browser reaches nginx, which routes application traffic to the frontend, documentation traffic to the docs service, and API traffic to the backend and PostgreSQL.</desc>
  <style>
    .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 20; }
    .accent { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; rx: 20; }
    .text { fill: #0f172a; font: 600 24px system-ui, sans-serif; text-anchor: middle; }
    .sub { fill: #475569; font: 16px system-ui, sans-serif; text-anchor: middle; }
    .line { stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <rect class="box" x="40" y="165" width="180" height="90"/><text class="text" x="130" y="205">Browser</text><text class="sub" x="130" y="232">one public host</text>
  <rect class="accent" x="320" y="165" width="200" height="90"/><text class="text" x="420" y="205">Ingress / nginx</text><text class="sub" x="420" y="232">routes by path</text>
  <rect class="box" x="620" y="40" width="200" height="90"/><text class="text" x="720" y="80">Frontend</text><text class="sub" x="720" y="107">/</text>
  <rect class="accent" x="620" y="165" width="200" height="90"/><text class="text" x="720" y="205">Docs</text><text class="sub" x="720" y="232">/docs</text>
  <rect class="box" x="620" y="290" width="200" height="90"/><text class="text" x="720" y="330">Backend</text><text class="sub" x="720" y="357">/api and /swagger</text>
  <rect class="box" x="940" y="290" width="200" height="90"/><text class="text" x="1040" y="330">PostgreSQL</text><text class="sub" x="1040" y="357">persistent data</text>
  <path class="line" d="M220 210 H320"/><path class="line" d="M520 190 L620 100"/><path class="line" d="M520 210 H620"/><path class="line" d="M520 230 L620 330"/><path class="line" d="M820 335 H940"/>
</svg>
